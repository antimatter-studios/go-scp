name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      # Both runners ship OpenSSH's scp, so the interoperability tests run here
      # rather than skipping.
      - name: Tests
        run: |
          set -euo pipefail
          command -v scp
          go test -race -count=1 ./...
      # Every statement in pkg/ must be covered; the step names whatever is not.
      - name: Coverage
        run: scripts/coverage-gate.sh

  # The library against real SSH hosts: two sshd containers on one network,
  # started and stopped by scripts/integration.sh. Every remote command goes
  # through a real login shell.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: scripts/integration.sh -v

  # Every program in examples/, run against the same test network and checked.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Examples
        run: scripts/examples.sh

  # Every fuzz target in pkg/scp, briefly. The test job already runs their seeds
  # and the inputs kept under testdata/fuzz; this looks for new ones.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz
        run: scripts/fuzz.sh 20s

  # The one required check: it stands for every job above, and fails when any of
  # them failed, was cancelled or was skipped.
  ci-ok:
    if: always()
    needs: [test, integration, examples, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          TEST: ${{ needs.test.result }}
          INTEGRATION: ${{ needs.integration.result }}
          EXAMPLES: ${{ needs.examples.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          failed=0
          for job in "test:$TEST" "integration:$INTEGRATION" "examples:$EXAMPLES" "fuzz:$FUZZ"; do
            if [ "${job#*:}" != "success" ]; then
              echo "$job" >&2
              failed=1
            fi
          done
          exit "$failed"

  # Publishes the coverage figure for the README badge: a shields.io endpoint file
  # on the badges branch, rewritten on every push to main. Not part of ci-ok, so a
  # badge that fails to publish never blocks a merge.
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure coverage
        id: cov
        run: echo "percent=$(scripts/coverage.sh "$RUNNER_TEMP/coverage.out")" >> "$GITHUB_OUTPUT"
      - name: Publish the badge
        env:
          PERCENT: ${{ steps.cov.outputs.percent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          color=red
          for step in 50:orange 70:yellow 80:yellowgreen 90:green 100:brightgreen; do
            if awk -v p="$PERCENT" -v t="${step%%:*}" 'BEGIN { exit !(p >= t) }'; then
              color="${step#*:}"
            fi
          done
          dir="$RUNNER_TEMP/badges"
          git init -q -b badges "$dir"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$color" > "$dir/coverage.json"
          git -C "$dir" add coverage.json
          git -C "$dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage ${PERCENT}%"
          git -C "$dir" push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
